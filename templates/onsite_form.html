<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Adding Onsite Form</title>

</head>

<body>

    <div class="app-container">

        <form action="/onsite_form" method="post">

            <div class="input-fields">

                <div class="field-style">

                    <label for="first-name-input">First Name</label>
                    <input type="text" id="first-name-input" name="first" required autofocus autocomplete="off" placeholder="Eddie" value="{{ first }}" />

                </div>

                <div class="field-style">

                    <label for="last-name-input">Last Name</label>
                    <input type="text" id="last-name-input" name="last" required autocomplete="off" placeholder="the Golden Eagle" value="{{ last }}"/>

                </div>

                <div class="field-style">

                    <label for="cin-input">CIN</label>
                    <input type="text" id="cin-input" name="cin" required autofocus autocomplete="off" placeholder="1234567" value="{{ cin }}" />

                </div>

                <div class="field-style">

                    <label for="email-input">Email</label>
                    <input type="text" id="email-input" name="email" required autocomplete="off" placeholder="eeagle01@calstatela.edu" value="{{ email }}"/>

                </div>

            </div>

            <!--Additional error message in case CIN is already inputted-->
            {% if message %}
                <h2 id="flash-message" class="{{ status }}">{{ message }}</h2>
            {% endif %}

            <button type="submit">Continue</button>

        </form>

        <a href="/cancel_enroll" class="dash-btn" style="display:inline-block; margin-top:20px">Cancel</a>

    </div>

    <script>
        /* Script to "turn off" error message and styling */

        const flashMsg = document.getElementById('flash-message');
        if (flashMsg) {
            setTimeout(() => {
                flashMsg.style.display = 'none';
            }, 3000);
        }

        /* Inactivity guard: if a member starts enrolling and walks away, the terminal
           must not stay stuck on a half-filled form. Discard and go back after 90s.
           Typing restarts the clock so nobody is cut off mid-answer. */

        let idleTimer;

        function resetIdle() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                window.location.href = '/cancel_enroll';
            }, 45000);
        }

        document.addEventListener('input', resetIdle);
        document.addEventListener('keydown', resetIdle);
        resetIdle();
    </script>

</body>

</html>
